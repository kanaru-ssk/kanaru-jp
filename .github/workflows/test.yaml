name: Test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
